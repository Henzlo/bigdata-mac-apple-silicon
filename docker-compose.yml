# ============================================================
#  Cloudera-like Big Data Stack for Mac M4 (ARM64)
#  Services: Hadoop, Hive, HBase, Spark, Zeppelin, Cloudbeaver
#  Start: docker-compose up -d
#  Stop:  docker-compose down
# ============================================================

networks:
  bigdata-net:
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hadoop_historyserver:
  hive_metastore_db:
  hbase_data:
  cloudbeaver_data:
  zeppelin_data:

services:

# ─────────────────────────────────────────────
#  HADOOP CORE
# ─────────────────────────────────────────────

  namenode:
    image: wxwmatt/hadoop-namenode:2.1.1-hadoop3.3.1-java8
    container_name: namenode
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=bigdata-cluster
    env_file:
      - hadoop.env
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5

  datanode:
    image: wxwmatt/hadoop-datanode:2.1.1-hadoop3.3.1-java8
    container_name: datanode
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - hadoop.env
    networks:
      - bigdata-net
    depends_on:
      - namenode

  resourcemanager:
    image: wxwmatt/hadoop-resourcemanager:2.1.1-hadoop3.3.1-java8
    container_name: resourcemanager
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - SERVICE_PRECONDITION=namenode:9000 namenode:9870 datanode:9864
    env_file:
      - hadoop.env
    networks:
      - bigdata-net
    depends_on:
      - namenode
      - datanode

  nodemanager:
    image: wxwmatt/hadoop-nodemanager:2.1.1-hadoop3.3.1-java8
    container_name: nodemanager
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8042:8042"
    environment:
      - SERVICE_PRECONDITION=namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088
    env_file:
      - hadoop.env
    networks:
      - bigdata-net
    depends_on:
      - resourcemanager

  historyserver:
    image: wxwmatt/hadoop-historyserver:2.1.1-hadoop3.3.1-java8
    container_name: historyserver
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    environment:
      - SERVICE_PRECONDITION=namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088
    env_file:
      - hadoop.env
    networks:
      - bigdata-net
    depends_on:
      - resourcemanager

# ─────────────────────────────────────────────
#  HIVE
# ─────────────────────────────────────────────

  hive-metastore-db:
    image: postgres:12-alpine
    container_name: hive-metastore-db
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
    volumes:
      - hive_metastore_db:/var/lib/postgresql/data
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - hadoop.env
    environment:
      - SERVICE_PRECONDITION=namenode:9870 datanode:9864 hive-metastore-db:5432
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-db/metastore
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName=org.postgresql.Driver
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName=hive
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword=hive123
      - HIVE_SITE_CONF_datanucleus_autoCreateSchema=true
      - HIVE_SITE_CONF_datanucleus_schema_autoCreateAll=true
      - HIVE_SITE_CONF_hive_metastore_schema_verification=false
      - HIVE_SITE_CONF_hive_metastore_uris=thrift://hive-metastore:9083
    command: /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"
    networks:
      - bigdata-net
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      namenode:
        condition: service_healthy

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - hadoop.env
    environment:
      - HIVE_CORE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-db/metastore
      - SERVICE_PRECONDITION=hive-metastore:9083
      - HIVE_SITE_CONF_hive_metastore_uris=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - bigdata-net
    depends_on:
      - hive-metastore

# ─────────────────────────────────────────────
#  ZOOKEEPER
# ─────────────────────────────────────────────

  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      - ZOO_LOG_LEVEL=ERROR
    networks:
      - bigdata-net

# ─────────────────────────────────────────────
#  HBASE
# ─────────────────────────────────────────────

  hbase:
    image: dajobe/hbase:latest
    container_name: hbase
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "16000:16000"
      - "16010:16010"
      - "16020:16020"
      - "16030:16030"
      - "8070:8070"
      - "9090:9090"
    environment:
      - HBASE_MANAGES_ZK=false
      - HBASE_ZOOKEEPER_QUORUM=zookeeper
    networks:
      - bigdata-net
    depends_on:
      - zookeeper
      - namenode

# ─────────────────────────────────────────────
#  SPARK
# ─────────────────────────────────────────────

  spark-master:
    image: apache/spark:latest
    container_name: spark-master
    platform: linux/amd64
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    networks:
      - bigdata-net

  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker
    platform: linux/amd64
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
    networks:
      - bigdata-net
    depends_on:
      - spark-master

# ─────────────────────────────────────────────
#  ZEPPELIN  (Notebook UI - Hue Alternative)
# ─────────────────────────────────────────────

  zeppelin:
    image: apache/zeppelin:0.11.0
    container_name: zeppelin
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9091:8080"
    environment:
      - ZEPPELIN_ADDR=0.0.0.0
      - ZEPPELIN_LOG_LEVEL=WARN
    volumes:
      - zeppelin_data:/opt/zeppelin/notebook
    networks:
      - bigdata-net
    depends_on:
      - hive-server
      - spark-master

# ─────────────────────────────────────────────
#  CLOUDBEAVER  (Web SQL UI)
# ─────────────────────────────────────────────

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8090:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - bigdata-net
    depends_on:
      - hive-server
