version: "3.8"

# ============================================================
#  Cloudera-like Big Data Stack for Mac M4 (ARM64)
#  Services: Hadoop, Hive, HBase, Spark, Hue, Zookeeper
#  Start: docker-compose up -d
#  Stop:  docker-compose down
# ============================================================

networks:
  bigdata-net:
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hadoop_historyserver:
  hive_metastore_db:
  hbase_data:
  hue_db:

# ─────────────────────────────────────────────
#  HADOOP CORE
# ─────────────────────────────────────────────
services:

  # --- NameNode (HDFS master) ---
  namenode:
    image: wxwmatt/hadoop-namenode:2.1.1-hadoop3.3.1-java8
    container_name: namenode
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9000:9000"   # HDFS
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=bigdata-cluster
    env_file:
      - hadoop.env
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --- DataNode (HDFS worker) ---
  datanode:
    image: wxwmatt/hadoop-datanode:2.1.1-hadoop3.3.1-java8
    container_name: datanode
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9864:9864"   # DataNode Web UI
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - hadoop.env
    networks:
      - bigdata-net
    depends_on:
      - namenode

  # --- ResourceManager (YARN) ---
  resourcemanager:
    image: wxwmatt/hadoop-resourcemanager:2.1.1-hadoop3.3.1-java8
    container_name: resourcemanager
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8088:8088"   # YARN ResourceManager Web UI
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    env_file:
      - hadoop.env
    networks:
      - bigdata-net
    depends_on:
      - namenode
      - datanode

  # --- NodeManager (YARN worker) ---
  nodemanager:
    image: wxwmatt/hadoop-nodemanager:2.1.1-hadoop3.3.1-java8
    container_name: nodemanager
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8042:8042"   # NodeManager Web UI
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - hadoop.env
    networks:
      - bigdata-net
    depends_on:
      - resourcemanager

  # --- HistoryServer (MapReduce job history) ---
  historyserver:
    image: wxwmatt/hadoop-historyserver:2.1.1-hadoop3.3.1-java8
    container_name: historyserver
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8188:8188"   # History Server Web UI
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - hadoop.env
    networks:
      - bigdata-net
    depends_on:
      - resourcemanager

# ─────────────────────────────────────────────
#  HIVE
# ─────────────────────────────────────────────

  # --- Hive Metastore Database (PostgreSQL) ---
  hive-metastore-db:
    image: postgres:14-alpine
    container_name: hive-metastore-db
    platform: linux/arm64   # Native ARM64
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
    volumes:
      - hive_metastore_db:/var/lib/postgresql/data
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Hive Metastore ---
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 hive-metastore-db:5432"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-db/metastore"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: "org.postgresql.Driver"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: "hive"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: "hive123"
      HIVE_SITE_CONF_datanucleus_autoCreateSchema: "false"
      HIVE_SITE_CONF_hive_metastore_uris: "thrift://hive-metastore:9083"
    command: /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"
    networks:
      - bigdata-net
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      namenode:
        condition: service_healthy

  # --- HiveServer2 (query engine) ---
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - hadoop.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-db/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
      HIVE_SITE_CONF_hive_metastore_uris: "thrift://hive-metastore:9083"
    ports:
      - "10000:10000"  # HiveServer2 JDBC
      - "10002:10002"  # HiveServer2 Web UI
    networks:
      - bigdata-net
    depends_on:
      - hive-metastore

# ─────────────────────────────────────────────
#  ZOOKEEPER (needed by HBase & Kafka)
# ─────────────────────────────────────────────

  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    platform: linux/arm64   # Native ARM64
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_LOG_LEVEL=ERROR
    networks:
      - bigdata-net

# ─────────────────────────────────────────────
#  HBASE
# ─────────────────────────────────────────────

  hbase:
    image: dajobe/hbase:latest
    container_name: hbase
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "16000:16000"  # HBase Master
      - "16010:16010"  # HBase Master Web UI
      - "16020:16020"  # HBase RegionServer
      - "16030:16030"  # HBase RegionServer Web UI
      - "8070:8070"    # HBase REST
      - "9090:9090"    # HBase Thrift
    environment:
      - HBASE_MANAGES_ZK=false
      - HBASE_ZOOKEEPER_QUORUM=zookeeper
    networks:
      - bigdata-net
    depends_on:
      - zookeeper
      - namenode

# ─────────────────────────────────────────────
#  SPARK
# ─────────────────────────────────────────────

  spark-master:
    image: bitnami/spark:3.4
    container_name: spark-master
    platform: linux/arm64   # Native ARM64
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master port
    networks:
      - bigdata-net

  spark-worker:
    image: bitnami/spark:3.4
    container_name: spark-worker
    platform: linux/arm64   # Native ARM64
    restart: unless-stopped
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8081:8081"   # Spark Worker Web UI
    networks:
      - bigdata-net
    depends_on:
      - spark-master

# ─────────────────────────────────────────────
#  HUE  (Cloudera-like Web UI)
# ─────────────────────────────────────────────

  hue-db:
    image: postgres:14-alpine
    container_name: hue-db
    platform: linux/arm64   # Native ARM64
    restart: unless-stopped
    environment:
      POSTGRES_DB: hue
      POSTGRES_USER: hue
      POSTGRES_PASSWORD: hue123
    volumes:
      - hue_db:/var/lib/postgresql/data
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hue -d hue"]
      interval: 10s
      timeout: 5s
      retries: 5

  hue:
    image: gethue/hue:latest
    container_name: hue
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8888:8888"   # Hue Web UI  ← Open this in your browser!
    volumes:
      - ./hue-config/hue.ini:/usr/share/hue/desktop/conf/z-hue.ini
    networks:
      - bigdata-net
    depends_on:
      hue-db:
        condition: service_healthy
      hive-server:
        condition: service_started
