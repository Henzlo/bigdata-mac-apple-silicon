# ============================================================
#  Hue Configuration
#  This file is mounted into the Hue container
# ============================================================

[desktop]
  secret_key=bigdata-mac-m4-secret-key-change-in-production
  allowed_hosts=*
  server_user=hue
  server_group=hue
  default_user=hue
  default_hdfs_superuser=root

  [[database]]
    engine=postgresql_psycopg2
    host=hue-db
    port=5432
    user=hue
    password=hue123
    name=hue

[hadoop]
  [[hdfs_clusters]]
    [[[default]]]
      fs_defaultfs=hdfs://namenode:9000
      webhdfs_url=http://namenode:9870/webhdfs/v1
      hadoop_hdfs_home=/usr/lib/hadoop
      hadoop_bin=/usr/bin/hadoop
      hadoop_conf_dir=/etc/hadoop/conf
      logical_name=namenode

  [[yarn_clusters]]
    [[[default]]]
      resourcemanager_host=resourcemanager
      resourcemanager_port=8032
      resourcemanager_api_url=http://resourcemanager:8088
      proxy_api_url=http://resourcemanager:8088
      history_server_api_url=http://historyserver:8188
      node_manager_api_url=http://nodemanager:8042

[beeswax]
  hive_server_host=hive-server
  hive_server_port=10000
  hive_conf_dir=/etc/hive/conf
  server_conn_timeout=120
  auth_username=hive
  auth_password=hive123

[hbase]
  hbase_clusters=(default|hbase:9090)
  hbase_conf_dir=/etc/hbase/conf

[spark]
  livy_server_url=http://spark-master:8998

[metastore]
  server_conn_timeout=120

[notebook]
  show_notebooks=true

[[interpreters]]
  [[[hive]]]
    name=Hive
    interface=hiveserver2

  [[[spark]]]
    name=Spark
    interface=livy

  [[[pig]]]
    name=Pig
    interface=pig
